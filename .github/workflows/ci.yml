# Builda e pusha a imagem do Caddy (com frontend embutido).
# Disparado por push em main, manualmente, ou via repository_dispatch do frontend.
# Quando termina, o deploy.yml é acionado automaticamente via workflow_run.
#
# IMPORTANTE: O frontend CI pusha sua imagem ANTES de disparar este workflow,
# garantindo que unifil-frontend:latest já está disponível quando o Caddy é buildado.
name: Infra CI
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [infra-ci]
  workflow_dispatch:

jobs:
  build-caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./caddy
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unifil-caddy:latest
            ghcr.io/${{ github.repository_owner }}/unifil-caddy:${{ github.sha }}
